<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f3e6d3">
<title>京都旅行 2026秋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 片手で読む縦長の旅のしおり。日付タブ（sticky）→ 時刻レールのタイムライン → お土産・やること */
:root{
  --bg:#f6f3ec;        /* 練色 */
  --paper:#fffdf8;
  --ink:#2a2823;
  --muted:#77716a;
  --line:#e2dccf;
  --matcha:#5b7a3a;    /* 抹茶 */
  --matcha-soft:#e7eedb;
  --shu:#c4472f;       /* 朱 */
  --shu-soft:#f8e3dc;
  --gold:#a8873c;
  --past:#b3ada3;
  --sky:#f3e6d3;--sun:#f1c27d;--hill1:#8a9a63;--hill2:#c4b79a;--roof:#4a4540;--wall:#efe7d8;--wood:#7b4a2e;
  --m1:#c4472f;--m2:#e0813a;--m3:#d9a93a;--water:#9fb7b4;--bamboo:#6f9a4a;--bamboo-node:#4f7333;--pine:#3f5a34;--gold-leaf:#d4ad3f;--gold-deep:#a8822a;
  --f-display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a17;--paper:#24221e;--ink:#ece6da;--muted:#a39c90;--line:#3a3731;
  --matcha:#9cbc72;--matcha-soft:#2c3523;--shu:#e8775d;--shu-soft:#3d2620;--gold:#d2b46a;--past:#6b665e;--sky:#2b2f3d;--sun:#e9dcb4;--hill1:#3c4733;--hill2:#3a3a40;--roof:#14130f;--wall:#4a443a;--wood:#6b4630;--m1:#b5432e;--m2:#c4713a;--m3:#b8923c;--water:#34474a;--bamboo:#4d6e36;--bamboo-node:#34502a;--pine:#2c3f27;--gold-leaf:#c9a240;--gold-deep:#8c6c22;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1a17;--paper:#24221e;--ink:#ece6da;--muted:#a39c90;--line:#3a3731;
  --matcha:#9cbc72;--matcha-soft:#2c3523;--shu:#e8775d;--shu-soft:#3d2620;--gold:#d2b46a;--past:#6b665e;--sky:#2b2f3d;--sun:#e9dcb4;--hill1:#3c4733;--hill2:#3a3a40;--roof:#14130f;--wall:#4a443a;--wood:#6b4630;--m1:#b5432e;--m2:#c4713a;--m3:#b8923c;--water:#34474a;--bamboo:#4d6e36;--bamboo-node:#34502a;--pine:#2c3f27;--gold-leaf:#c9a240;--gold-deep:#8c6c22;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--matcha);outline-offset:2px;border-radius:6px}

/* hero */
.hero{padding-block:28px 18px}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.2;margin:6px 0 4px;text-wrap:balance}
.dates{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.anniv{margin-top:14px;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--shu);border-radius:12px;background:var(--shu-soft)}
.anniv .num{white-space:nowrap;flex:none;font-family:var(--f-display);font-size:28px;line-height:1;color:var(--shu);font-weight:700}
.anniv .txt{font-size:13px;line-height:1.5}
.anniv .txt b{font-family:var(--f-display);font-size:15px}
.status{margin-top:10px;font-size:13px;color:var(--matcha);font-weight:500}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-block:8px}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 4px;cursor:pointer;text-align:center;line-height:1.3}
.tab .d{display:block;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab .l{display:block;font-weight:700;font-size:14px}
.tab[aria-selected="true"]{background:var(--matcha);border-color:var(--matcha);color:var(--paper)}
.tab[aria-selected="true"] .d{color:inherit;opacity:.85}
.tab.is-anniv .l::after{content:"記念日";font-size:10px;margin-left:4px;padding:0 5px;border-radius:99px;background:var(--shu);color:#fff;vertical-align:2px}

/* day */
.day{padding-block:18px 8px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.dayhead h2{font-family:var(--f-display);font-size:22px;margin:0}
.dayhead .stay{font-size:12px;color:var(--muted);text-align:right}
.dayhead .stay b{display:block;color:var(--ink);font-size:13px}

.tl{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:52px 18px 1fr;column-gap:8px}
.it .tm{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;text-align:right;padding-top:12px;color:var(--ink)}
.it .tm.est{color:var(--muted);font-weight:400}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:var(--line)}
.it:first-child .rail::before{top:18px}
.it:last-child .rail::before{bottom:calc(100% - 18px)}
.dot{position:absolute;left:50%;top:15px;width:10px;height:10px;border-radius:50%;transform:translateX(-50%);background:var(--paper);border:2px solid var(--muted)}
.it[data-cat="meal"] .dot{border-color:var(--gold)}
.it[data-cat="sight"] .dot{border-color:var(--matcha)}
.it[data-cat="stay"] .dot{border-color:var(--shu)}
.body{padding-block:8px;min-width:0}
.card{padding:6px 0}
.ttl{font-weight:700;font-size:16px;line-height:1.45}
.cat{font-size:11px;letter-spacing:.08em;color:var(--muted);margin-right:6px;font-weight:500}
.memo{font-size:13.5px;color:var(--ink);margin-top:2px}
.memo .sub{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--muted)}
.chip.paid{border-color:var(--matcha);color:var(--matcha)}
.chip.todo{border-color:var(--shu);color:var(--shu)}
.chip.price{color:var(--ink)}
.map{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:99px;background:var(--matcha-soft);color:var(--matcha);text-decoration:none}
.map svg{width:12px;height:12px}
.opt{font-size:11px;color:var(--muted);border:1px dashed var(--muted);border-radius:99px;padding:0 6px;margin-left:6px;vertical-align:1px;font-weight:400}

.it.past .ttl,.it.past .memo,.it.past .tm{color:var(--past)}
.it.past .dot{border-color:var(--past)}
.it.now .card{background:var(--shu-soft);border-radius:12px;padding:8px 12px;margin-left:-4px;border:1px solid var(--shu)}
.it.now .dot{background:var(--shu);border-color:var(--shu);box-shadow:0 0 0 4px var(--shu-soft)}
.nowpill{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--shu);border-radius:99px;padding:0 8px;margin-right:6px;vertical-align:1px}
.it.next .tm{color:var(--shu)}

/* sections */
.sec{padding-block:26px 6px}
.sec h2{font-family:var(--f-display);font-size:22px;margin:0 0 4px}
.sec .lead{font-size:13px;color:var(--muted);margin:0 0 10px}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.row input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);background:var(--paper);display:grid;place-content:center;cursor:pointer;margin:0}
.row input[type=checkbox]::after{content:"";width:12px;height:7px;border-left:2.5px solid var(--paper);border-bottom:2.5px solid var(--paper);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.row input[type=checkbox]:checked{background:var(--matcha);border-color:var(--matcha)}
.row input[type=checkbox]:checked::after{opacity:1}
.row label{flex:1;min-width:0;cursor:pointer}
.row .nm{display:block;font-weight:500}
.row .nt{display:block;font-size:12px;color:var(--muted)}
.row.done .nm{color:var(--past);text-decoration:line-through}
.row .del{border:none;background:none;color:var(--muted);font-size:12px;padding:4px 6px;cursor:pointer}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.add button{border:none;background:var(--matcha);color:var(--paper);border-radius:10px;padding:0 16px;font-weight:700;cursor:pointer}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.empty{padding:14px 2px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
footer{padding-block:28px 40px;text-align:center;font-family:var(--f-display);color:var(--muted);font-size:13px}

/* illustrations */
.hero-band{line-height:0;background:var(--sky)}
.hero-band .art{display:block;width:100%;height:clamp(150px,42vw,230px)}
.day-art{display:block;width:100%;height:112px;border-radius:14px;margin-bottom:14px}
.fall use{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .fall{animation:drift 9s ease-in-out infinite}
  .fall.f1{animation-duration:11s;animation-delay:-3s}.fall.f2{animation-duration:13s;animation-delay:-6s}
  .fall.f3{animation-duration:10s;animation-delay:-2s}.fall.f4{animation-duration:12s;animation-delay:-8s}
}
@keyframes drift{0%{transform:translate(0,-6px)}50%{transform:translate(10px,8px)}100%{transform:translate(0,-6px)}}
@media (prefers-reduced-motion:no-preference){.it.now .dot{animation:pulse 2.4s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 8px transparent}}
</style>

<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
</head>

 ]},
 {key:'day2',date:'2026-11-01',dow:'日',label:'2日目',title:'清水さんぽとROKU',stay:'ROKU KYOTO',items:[
  {at:'08:00',time:'8:00',cat:'meal',title:'朝食',memo:'マップでピンを立てているお店へ。<span class="sub">夜お腹いっぱいでなければ席を予約してみる</span>'},
  {at:'09:00',cat:'sight',title:'清水寺',map:'清水寺'},

  {at:'13:45',cat:'move',title:'五条駅 → 北大路駅',map:'五条駅 京都市営地下鉄'},

 {key:'day3',date:'2026-11-02',dow:'月',label:'3日目',anniv:true,title:'記念日。金閣寺から帰路へ',stay:'',items:[

  {at:'13:45',cat:'sight',title:'龍安寺 or 仁和寺',memo:'<a class="map" target="_blank" rel="noopener" href="'+gm('龍安寺')+'">'+MAPICON+'龍安寺</a> <a class="map" target="_blank" rel="noopener" href="'+gm('仁和寺')+'">'+MAPICON+'仁和寺</a>'},
  {at:'14:30',time:'14–15時台',cat:'move',title:'新幹線　京都 → 博多',chips:[{t:'未予約',k:'todo'}],map:'京都駅'}

];
function gm(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function jstNow(){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;
  return {date:`${g('year')}-${g('month')}-${g('day')}`,min:(+g('hour'))*60+(+g('minute'))};
}
const toMin=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};

let current=null;
function initialDay(){
  const h=(location.hash||'').slice(1);
  if(DAYS.some(d=>d.key===h))return h;
  const n=jstNow();const d=DAYS.find(d=>d.date===n.date);
  if(d)return d.key;
  try{const s=localStorage.getItem('kyoto-tab');if(DAYS.some(d=>d.key===s))return s}catch(e){}
  return 'day1';
}
function renderTabs(){
  const n=jstNow();
  document.getElementById('tabs').innerHTML=DAYS.map(d=>{
    const[,m,dd]=d.date.split('-');
    return `<button class="tab${d.anniv?' is-anniv':''}" role="tab" id="tab-${d.key}" aria-selected="${d.key===current}" data-k="${d.key}">
      <span class="d">${+m}/${+dd}（${d.dow}）${d.date===n.date?'・今日':''}</span><span class="l">${d.label}</span></button>`}).join('');
}
function renderDay(){
  const d=DAYS.find(x=>x.key===current);const n=jstNow();
  const today=d.date===n.date, before=n.date<d.date;
  let nowIdx=-1;
  if(today){d.items.forEach((it,i)=>{if(toMin(it.at)<=n.min)nowIdx=i})}
  const items=d.items.map((it,i)=>{
    let st='';
    if(!before){ if(!today||i<nowIdx)st='past'; if(today&&i===nowIdx)st='now'; if(today&&i===nowIdx+1)st='next'; }
    const chips=(it.chips||[]).map(c=>`<span class="chip ${c.k||''}">${c.x?c.x+'・':''}${esc(c.t)}</span>`).join('');
    const map=it.map?`<a class="map" target="_blank" rel="noopener" href="${gm(it.map)}">${MAPICON}地図</a>`:'';
    const tools=(chips||map)?`<div class="chips">${chips}${map}</div>`:'';
    return `<li class="it ${st}" data-cat="${it.cat}">
      <div class="tm${it.time?'':' est'}">${it.time?esc(it.time):'—'}</div>
      <div class="rail"><span class="dot"></span></div>
      <div class="body"><div class="card">
        <div class="ttl">${st==='now'?'<span class="nowpill">いま</span>':''}<span class="cat">${CAT[it.cat]}</span>${esc(it.title)}${it.opt?'<span class="opt">時間があれば</span>':''}</div>
        ${it.memo?`<div class="memo">${it.memo}</div>`:''}${tools}
      </div></div></li>`}).join('');
  const done=!before&&!today;
  const art=document.getElementById('art-'+d.key);
  document.getElementById('day').innerHTML=(art?art.innerHTML:'')+`
    <div class="dayhead"><h2>${d.title}</h2>${d.stay?`<div class="stay">泊まり<b>${d.stay}</b></div>`:'<div class="stay">帰る日</div>'}</div>
    <ol class="tl">${items}</ol>`;
  const s=document.getElementById('status');
  if(today&&nowIdx>=0){s.hidden=false;s.textContent='いまは「'+d.items[nowIdx].title.replace(/　.*/,'')+'」のころ'}
  else s.hidden=true;
  const tr=document.querySelector('.it.now');
  return {tr,done};
}
function renderAnniv(){
  const n=jstNow();const t=document.getElementById('annivTxt');const num=document.getElementById('annivNum');
  const days=Math.round((Date.parse('2026-11-02')-Date.parse(n.date))/864e5);
  const start=Math.round((Date.parse('2026-10-31')-Date.parse(n.date))/864e5);
  if(days===0){num.textContent='今日';t.textContent='結婚1周年、おめでとう。'}
  else if(start>0){num.textContent='あと'+start+'日';t.innerHTML='出発まで。3日目の11/2が結婚記念日です。'}
  else if(days>0){num.textContent='あと'+days+'日';t.textContent='記念日まで。'}
}
function select(k,scroll){
  current=k;try{localStorage.setItem('kyoto-tab',k)}catch(e){}
  renderTabs();const r=renderDay();
  if(scroll&&r.tr){r.tr.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){select(b.dataset.k,false);document.getElementById('day').scrollIntoView({block:'start'});window.scrollBy(0,-70)}});
current=initialDay();renderAnniv();select(current,false);
setTimeout(()=>{const tr=document.querySelector('.it.now');if(tr)tr.scrollIntoView({block:'center'})},300);
setInterval(()=>{renderAnniv();renderTabs();renderDay()},60000);

/* ===== 共有チェックリスト（db: checklist コレクション） ===== */
const FALLBACK=[
 {id:'todo-shinkansen',kind:'todo',name:'帰りの新幹線を取る（京都 → 博多）',note:'11/2 14〜15時台。期限は10/23だったので要確認',order:0},
 ...['生麩','ふわふわ八橋','お漬物','梅干し|おうすの里','湯葉ふりかけ','七味','ロイズのポテチ|抹茶×山椒','551'].map((s,i)=>{const[n,t]=s.split('|');return{id:'s'+(i+1),kind:'souvenir',name:n,note:t||'',order:(i+1)*10}})
];
let rows=[], db=null, readOnly=false;
function renderLists(){
  const todos=rows.filter(r=>r.kind==='todo').sort((a,b)=>a.order-b.order);
  const sous=rows.filter(r=>r.kind==='souvenir').sort((a,b)=>a.order-b.order);
  const li=r=>`<li class="row${r.done?' done':''}"><input type="checkbox" id="cb-${esc(r.id)}" data-id="${esc(r.id)}" ${r.done?'checked':''} ${readOnly?'disabled':''}>
    <label for="cb-${esc(r.id)}"><span class="nm">${esc(r.name)}</span>${r.note?`<span class="nt">${esc(r.note)}</span>`:''}</label>
    ${r.kind==='souvenir'&&r.custom&&!readOnly?`<button class="del" data-del="${esc(r.id)}" aria-label="${esc(r.name)}を削除">削除</button>`:''}</li>`;
  document.getElementById('todoList').innerHTML=todos.length?todos.map(li).join(''):'<li class="empty">やることはありません</li>';
  document.getElementById('souList').innerHTML=sous.length?sous.map(li).join(''):'<li class="empty">まだありません。下の欄から追加できます。</li>';
  const got=sous.filter(r=>r.done).length;
  document.getElementById('souCount').textContent=sous.length?`${got} / ${sous.length} 購入`:'';
  document.getElementById('addForm').hidden=readOnly;
}
function local(){try{return JSON.parse(localStorage.getItem('kyoto-list')||'null')}catch(e){return null}}
function saveLocal(){try{localStorage.setItem('kyoto-list',JSON.stringify(rows))}catch(e){}}

async function setDone(id,done){
  const r=rows.find(x=>x.id===id);if(!r)return;r.done=done;renderLists();
  if(db){try{await db.doc('checklist/'+id).update({done})}catch(e){onWriteErr(e)}}else saveLocal();
}
async function addItem(name){
  const id='c'+Date.now().toString(36);
  const r={id,kind:'souvenir',name,note:'',order:Date.now(),done:false,custom:true};
  rows.push(r);renderLists();
  if(db){try{const{id:_,...body}=r;await db.doc('checklist/'+id).set(body)}catch(e){onWriteErr(e)}}else saveLocal();
}
async function delItem(id){
  rows=rows.filter(r=>r.id!==id);renderLists();
  if(db){try{await db.doc('checklist/'+id).delete()}catch(e){onWriteErr(e)}}else saveLocal();
}
function onWriteErr(e){
  if(e&&e.code==='invalid_argument'){readOnly=true;document.getElementById('syncNote').textContent='このリンクでは閲覧のみです。チェックは編集権限のある人が付けられます。'}
  else document.getElementById('syncNote').textContent='保存できませんでした。通信状況を確認してもう一度お試しください。';
  renderLists();
}
document.addEventListener('change',e=>{if(e.target.matches('.row input[type=checkbox]'))setDone(e.target.dataset.id,e.target.checked)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(b)delItem(b.dataset.del)});
document.getElementById('addForm').addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('addInput');const v=i.value.trim();if(v){addItem(v);i.value=''}});

(async()=>{
  db=null;
  if(!db){
    rows=local()||FALLBACK.map(r=>({...r,done:false}));renderLists();
    
    return;
  }
  try{const u=await window.claude.use('user');if(u){const w=await u.can('data.write');if(w===false)readOnly=true}}catch(e){}
  document.getElementById('syncNote').textContent=readOnly?'閲覧のみです。':'チェックはふたりの端末で共有されます。';
  db.collection('checklist').onSnapshot(snap=>{
    rows=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderLists();
  },err=>{document.getElementById('syncNote').textContent='共有リストに接続できませんでした。再読み込みしてください。'});
})();
</script>
